name: Build Android APK

on:
  push:
    tags:
      - 'v*'            # 打 v3.1.0 这类 tag 时自动构建并发布 APK
  workflow_dispatch:     # 也支持在 Actions 页面手动触发

permissions:
  contents: write       # 创建 Release / 上传 APK 附件需要

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup JDK 17（AGP / RN 0.86 要求）
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"

      - name: Install npm dependencies
        run: npm ci

      - name: 还原签名密钥库（可选）
        # 如需多次发布的 APK 能互相覆盖安装，请把自己的 release-key.keystore
        # 用 base64 编码后存入仓库 Secret：RELEASE_KEYSTORE_BASE64
        # 未设置时 build-android.sh 会自动生成一个临时密钥（每次构建都不同，仅适合尝鲜）
        # 注意：step 的 if 不支持 secrets 上下文，故改为在 env 注入后于脚本内判断是否为空
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release-key.keystore
            echo "已还原签名密钥库（来自 Secret RELEASE_KEYSTORE_BASE64）"
          else
            echo "未设置 RELEASE_KEYSTORE_BASE64，将使用 build-android.sh 生成的临时密钥"
          fi

      - name: Build release APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          CI: 'true'            # 避免 expo / gradle 在 CI 中弹出交互式提示
        run: bash build-android.sh release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
